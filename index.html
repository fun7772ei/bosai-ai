<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1b6b52" />
    <meta
      name="description"
      content="152件の防災情報をオフラインで検索できる防災辞書アプリ。"
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>ぼうさい辞書</title>
    <script type="module" crossorigin src="/bosai-ai/assets/index-dPMe_8xM.js"></script>
    <link rel="stylesheet" crossorigin href="/bosai-ai/assets/index-CChygQp6.css">
  </head>
  <body>
    <a class="skip" href="#main">本文へ移動</a>

    <div class="app-frame" id="appFrame" data-mode="landing">
      <header class="topbar">
        <button id="homeButton" class="brand" type="button">
          <span class="brand-mark" aria-hidden="true">防</span>
          <span class="brand-name">ぼうさい辞書</span>
        </button>
        <div class="topbar-right">
          <button
            id="ruriStatusChip"
            type="button"
            class="ruri-chip"
            data-state="checking"
            aria-haspopup="dialog"
            hidden
          >
            <span class="ruri-chip-dot" aria-hidden="true"></span>
            <span id="ruriStatusLabel" class="ruri-chip-label">確認中…</span>
            <span id="ruriChipBar" class="ruri-chip-bar" hidden>
              <span id="ruriChipFill" class="ruri-chip-fill"></span>
            </span>
          </button>
          <span id="offlineBadge" class="offline-badge" hidden>オフライン</span>
          <div id="updateNotice" class="update-chip" hidden>
            <span>新しい版があります</span>
            <button id="updateApply" type="button" class="chip-btn">更新</button>
          </div>
        </div>
      </header>

      <div id="errorBanner" class="error-banner" role="alert" hidden>
        <p id="errorText"></p>
        <div class="error-actions">
          <button id="errorReload" type="button" class="tonal-btn">
            再読み込み
          </button>
          <button id="errorDismiss" type="button" class="text-btn">
            基本検索で続ける
          </button>
        </div>
      </div>

      <main id="main" class="main-stage" tabindex="-1">
        <section class="search-stage" aria-label="防災検索">
          <form id="searchForm" class="search-form" role="search">
            <label class="sr-only" for="searchQuery"
              >いま困っていること・知りたいことを入力</label
            >
            <div class="search-pill">
              <svg
                class="search-icon"
                aria-hidden="true"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="11" cy="11" r="7" />
                <path d="m20 20-3.5-3.5" />
              </svg>
              <input
                id="searchQuery"
                type="search"
                maxlength="2000"
                autocomplete="off"
                enterkeyhint="search"
                placeholder="困っていることや言葉を入力"
              />
              <button
                id="searchClear"
                type="button"
                class="icon-btn"
                aria-label="入力を消す"
                hidden
              >
                <svg
                  aria-hidden="true"
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                >
                  <path d="m6 6 12 12M6 18 18 6" />
                </svg>
              </button>
              <button
                id="searchStop"
                type="button"
                class="stop-btn"
                hidden
              >
                停止
              </button>
              <button id="searchSubmit" type="submit" class="primary-btn">
                さがす
              </button>
            </div>
          </form>

          <div
            id="categoryBar"
            class="category-bar"
            role="group"
            aria-label="災害カテゴリ"
          ></div>

          <div id="ruriInlineProgress" class="m3-dl-card" hidden>
            <div class="m3-dl-row">
              <span id="ruriInlineTitle" class="m3-dl-title"
                >オフライン検索データを保存中</span
              >
              <span id="ruriInlineMeta" class="m3-dl-meta">0%</span>
            </div>
            <div
              id="ruriInlineTrack"
              class="m3-progress-track"
              role="progressbar"
              aria-label="オフライン検索データの保存進捗"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="0"
              data-indeterminate="false"
              data-complete="false"
            >
              <div id="ruriInlineFill" class="m3-progress-fill"></div>
              <span class="m3-progress-stop" aria-hidden="true"></span>
            </div>
            <div class="m3-dl-foot">
              <span id="ruriInlineDetail" class="m3-dl-detail"></span>
              <div class="m3-dl-actions">
                <button
                  id="ruriInlineOpen"
                  type="button"
                  class="text-btn compact-btn"
                >
                  詳細
                </button>
                <button
                  id="ruriInlineCancel"
                  type="button"
                  class="text-btn compact-btn"
                >
                  中止
                </button>
              </div>
            </div>
          </div>
        </section>

        <section
          id="resultsRegion"
          class="results-region"
          aria-live="polite"
          hidden
        >
          <div id="subgroupBar" class="subgroup-bar" hidden></div>
          <p id="resultNotice" class="result-notice" hidden></p>
          <div id="clarifyCard" class="clarify-card" hidden></div>
          <div id="resultCards" class="result-cards"></div>
        </section>
      </main>

      <footer class="quiet-footer">
        <p>
          現在の警報・避難先の安全は、自治体・気象庁の最新情報を確認してください。
        </p>
        <a href="./model-notices.txt" target="_blank" rel="noopener"
          >データの出典と利用条件</a
        >
      </footer>

      <!-- Hidden developer diagnostics: only shown when URL has ?debug=1 -->
      <section
        id="debugPanel"
        class="debug-panel"
        aria-label="開発用診断"
        hidden
      >
        <h2>開発用診断（?debug=1）</h2>
        <p id="debugBuild"></p>
        <p id="debugSaved"></p>
        <p id="debugState"></p>
        <p id="debugShell"></p>
        <div class="debug-actions">
          <select id="debugMode" aria-label="検索モード">
            <option value="hybrid">hybrid（軽量＋Ruri）</option>
            <option value="light">light（軽量のみ）</option>
            <option value="ruri">ruri（Ruriのみ）</option>
          </select>
          <button id="debugSave" type="button" class="tonal-btn">Ruri保存</button>
          <button id="debugLoad" type="button" class="tonal-btn">読み込み</button>
          <button id="debugReset" type="button" class="tonal-btn">解放</button>
          <button id="debugExport" type="button" class="tonal-btn">JSON保存</button>
        </div>
      </section>
    </div>

    <!-- First-run modal: only shown online on first visit before Ruri is saved -->
    <div
      id="ruriModal"
      class="modal-backdrop"
      role="dialog"
      aria-modal="true"
      aria-labelledby="ruriModalTitle"
      hidden
    >
      <div class="modal-card">
        <h2 id="ruriModalTitle">オフライン検索の準備</h2>
        <p id="ruriModalBody" class="modal-body">
          ことばの意味で防災情報を探せる追加データ（約44MB）を端末に保存します。一度保存するとネットが切れても使えます。
        </p>
        <div id="ruriProgressBox" class="m3-progress-box">
          <div class="m3-dl-row">
            <span id="ruriModalStatus" class="m3-dl-title">保存状況を確認中…</span>
            <span id="ruriModalMeta" class="m3-dl-meta">0%</span>
          </div>
          <div
            id="ruriModalTrack"
            class="m3-progress-track m3-progress-lg"
            role="progressbar"
            aria-label="オフライン検索データの保存進捗"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
            data-indeterminate="false"
            data-complete="false"
          >
            <div id="ruriModalFill" class="m3-progress-fill"></div>
            <span class="m3-progress-stop" aria-hidden="true"></span>
          </div>
          <p id="ruriModalDetail" class="m3-dl-detail"></p>
        </div>
        <div class="modal-actions">
          <button id="ruriModalSave" type="button" class="primary-btn">
            保存して使う（約44MB）
          </button>
          <button id="ruriModalSkip" type="button" class="text-btn">
            今は基本検索だけで使う
          </button>
          <button id="ruriModalCancel" type="button" class="text-btn" hidden>
            ダウンロードを中止
          </button>
        </div>
      </div>
    </div>

  </body>
</html>
