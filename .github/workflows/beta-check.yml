name: Check Ruri public beta
on:
  pull_request:
    branches: [main, refactor/architecture-reset-20261015]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quick:
    name: Fast unit and build checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node scripts/check-public-build.mjs
  verify:
    name: Full real-Ruri and offline regression
    needs: quick
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: python3 scripts/fetch-ruri-assets.py
      - name: Real Ruri, regression, offline restart and safe update
        run: |
          npm run preview -- --port 4173 --strictPort > /tmp/bosai-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:4173/bosai-ai/ > /dev/null; then break; fi
            sleep 1
          done
          BOSAI_MOONSHINE_NATIVE_PROBE=1 node scripts/voice-isolation-check.mjs
          node scripts/moonshine-manifest-check.mjs
          python3 scripts/fetch-moonshine-assets.py
          node scripts/moonshine-runtime-check.mjs
          node scripts/voice-review-browser-check.mjs
          node scripts/redesign-ui-check.mjs
          node scripts/redesign-update-check.mjs
          node scripts/beta-browser-check.mjs --cases=scripts/evaluation/final-64.json --tag=beta-regression-64
          node scripts/beta-browser-check.mjs --cases=scripts/evaluation/beta-unseen-80.json --tag=beta-review-regression-80
          node scripts/beta-browser-check.mjs --cases=scripts/evaluation/beta-review-final-60.json --tag=beta-review-final-60
      - name: Text conversation with real Ruri and offline restart
        run: |
          node scripts/conversation-v2-browser-check.mjs --cases=scripts/evaluation/voice-integration-heldout.json --tag=voice-integration-heldout-ci
          node scripts/conversation-v2-browser-check.mjs --cases=scripts/evaluation/conversation-core-heldout-18.json --tag=conversation-core-heldout-ci
          node scripts/conversation-v2-browser-check.mjs --cases=scripts/evaluation/conversation-core-final-12.json --tag=conversation-core-final-ci
          node scripts/conversation-v2-browser-check.mjs --cases=scripts/evaluation/conversation-core-review-final-6.json --tag=conversation-core-review-final-ci
          node scripts/conversation-browser-check.mjs
          node scripts/conversation-v2-browser-check.mjs --tag=conversation-v2-dev-ci
          node scripts/conversation-v2-browser-check.mjs --cases=scripts/evaluation/conversation-v2-final-32.json --tag=conversation-v2-regression32-ci
          node scripts/conversation-v2-browser-check.mjs --cases=scripts/evaluation/conversation-v2-final-24.json --tag=conversation-v2-regression24-ci
          node scripts/conversation-v2-browser-check.mjs --cases=scripts/evaluation/conversation-v3-final-12.json --tag=conversation-v3-regression-ci
          node scripts/conversation-v2-browser-check.mjs --cases=scripts/evaluation/conversation-v4-final-12.json --tag=conversation-v4-regression-ci
          node scripts/conversation-v2-browser-check.mjs --cases=scripts/evaluation/conversation-v5-final-8.json --tag=conversation-v5-regression-ci
          node scripts/conversation-v2-browser-check.mjs --cases=scripts/evaluation/conversation-v6-final-6.json --tag=conversation-v6-final-ci
          node scripts/conversation-v2-browser-check.mjs --cases=scripts/evaluation/conversation-v7-final-4.json --tag=conversation-v7-final-ci
          node scripts/conversation-v2-browser-check.mjs --cases=scripts/evaluation/conversation-v8-final-2.json --tag=conversation-v8-final-ci
          node scripts/conversation-v2-browser-check.mjs --cases=scripts/evaluation/conversation-v9-final-2.json --tag=conversation-v9-final-ci
          node scripts/conversation-v2-browser-check.mjs --cases=scripts/evaluation/conversation-v10-final-3.json --tag=conversation-v10-final-ci
          node scripts/conversation-v2-browser-check.mjs --cases=scripts/evaluation/conversation-v11-final-2.json --tag=conversation-v11-final-ci
          node scripts/conversation-v2-browser-check.mjs --cases=scripts/evaluation/conversation-v12-final-2.json --tag=conversation-v12-final-ci
          node scripts/conversation-v2-browser-check.mjs --cases=scripts/evaluation/conversation-v13-final-2.json --tag=conversation-v13-final-ci
          node scripts/conversation-v2-browser-check.mjs --cases=scripts/evaluation/conversation-v14-final-2.json --tag=conversation-v14-final-ci
          node scripts/conversation-v2-browser-check.mjs --cases=scripts/evaluation/conversation-v15-final-2.json --tag=conversation-v15-final-ci
          node scripts/conversation-v2-browser-check.mjs --cases=scripts/evaluation/conversation-v16-final-4.json --tag=conversation-v16-final-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ruri-beta-check
          path: |
            test-results/redesign-*.json
            test-results/redesign-*.png
            test-results/moonshine-manifests.json
            test-results/moonshine-assets.json
            test-results/moonshine-runtime.json
            test-results/voice-review-ui.json
            test-results/voice-integration-*.json
            test-results/conversation-core-*.json
            test-results/beta-review-regression-80.json
            test-results/beta-review-final-60.json
            test-results/beta-regression-64.json
            test-results/beta-mobile.png
            test-results/beta-ipad-layout.png
            test-results/conversation-v16-*.json
            test-results/conversation-v16-*-mobile.png
            test-results/conversation-v15-*.json
            test-results/conversation-v15-*-mobile.png
            test-results/conversation-v14-*.json
            test-results/conversation-v14-*-mobile.png
            test-results/conversation-v13-*.json
            test-results/conversation-v13-*-mobile.png
            test-results/conversation-v12-*.json
            test-results/conversation-v12-*-mobile.png
            test-results/conversation-v11-*.json
            test-results/conversation-v11-*-mobile.png
            test-results/conversation-v10-*.json
            test-results/conversation-v10-*-mobile.png
            test-results/conversation-v9-*.json
            test-results/conversation-v9-*-mobile.png
            test-results/conversation-v8-*.json
            test-results/conversation-v8-*-mobile.png
            test-results/conversation-v7-*.json
            test-results/conversation-v7-*-mobile.png
            test-results/conversation-v6-*.json
            test-results/conversation-v5-*.json
            test-results/conversation-v4-*.json
            test-results/conversation-v3-*.json
            test-results/conversation-v2-*.json
            test-results/conversation-v2-*-mobile.png
            test-results/conversation-v3-*-mobile.png
            test-results/conversation-v6-*-mobile.png
            test-results/conversation-v5-*-mobile.png
            test-results/conversation-v4-*-mobile.png
