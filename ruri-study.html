<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ruriサイズ・検索改善比較（研究用）</title><meta name="theme-color" content="#176b5b"></head><body><main style="max-width:1100px;margin:auto;padding:24px"><h1>Ruri検索比較・研究版</h1><p>公開版は更新しません。30M / 70M / 130Mを同時常駐させず比較します。改善案には長文の否定を誤読・誤棄却する副作用があり、公開採用せず比較用に残しています。生成LLMは使用しません。候補は質問の答えを保証せず、選んだ辞書原文を表示します。現在の災害・個人の安全判断は確認できません。</p><section class="surface" style="padding:20px"><label>モデル<select id="studyModel"><option>30m</option><option>70m</option><option>130m</option></select></label><label>方式<select id="studyMode"><option value="hybrid">軽量＋Embedding</option><option value="ruri">Embedding単独</option><option value="light">軽量のみ</option></select></label><label>検索条件<select id="studyAlgorithm"><option value="improved">意図・根拠ガード（改善案）</option><option value="baseline">公開版と同条件</option></select></label><p id="studySaved" role="status"></p><p id="studyState" role="status"></p><button id="studySave">選択モデルを明示保存</button><button id="studyLoad">読み込む</button><button id="studyStop">停止</button><button id="studyReset">実行モデルを解放</button><form id="studyForm"><label for="studyQuestion">質問（最大1000文字・512トークンを超えたら切り捨てず切替）</label><textarea id="studyQuestion" rows="5" maxlength="1000" required></textarea><button id="studySearch" type="submit">検索</button></form></section><p id="studyMessage" role="status"></p><div id="studyChoices"></div><div id="studyResults"></div><article id="studyEntry" class="surface" hidden></article><details><summary>診断</summary><p id="studyShell"></p><pre id="studyMetrics" style="white-space:pre-wrap"></pre><button id="studyExport">診断JSONを保存</button></details></main><script type="module" src="/research/ruri/main.js"></script></body></html>
